<style>
:root{
  --bg:#08090C; --bg-alt:#0A0C10; --panel:#101319; --panel-2:#0D0F14;
  --border:rgba(255,255,255,.08); --border-soft:rgba(255,255,255,.06);
  --head:#FFFFFF; --text:#E7EAEF; --muted:#8A94A2; --faint:#5B6573;
  --input-bg:#0E1116; --overlay-soft:rgba(255,255,255,.05); --overlay-bd:rgba(255,255,255,.14);
  --gold:#D4A437; --gold-deep:#E6BE54; --gold-grad:linear-gradient(180deg,#E6BE54,#D4A437);
  --gold-soft-bg:rgba(212,164,55,.10); --gold-soft-bd:rgba(212,164,55,.30);
  --green:#2BB673; --amber:#E8A33D; --red:#E0533D; --blue:#3D8BE0;
}
[data-theme="light"]{
  --bg:#F5F3EE; --bg-alt:#FBFAF6; --panel:#FFFFFF; --panel-2:#F3F1EA;
  --border:rgba(27,31,38,.10); --border-soft:rgba(27,31,38,.07);
  --head:#0B0D10; --text:#222831; --muted:#5B6573; --faint:#9AA3AF;
  --input-bg:#F3F1EA; --overlay-soft:rgba(27,31,38,.04); --overlay-bd:rgba(27,31,38,.14);
  --gold-deep:#A6781A; --gold-soft-bg:rgba(212,164,55,.14); --gold-soft-bd:rgba(212,164,55,.34);
  --green:#1F9760;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Sora',sans-serif;color:var(--head);line-height:1.25}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter';font-weight:600;font-size:14px;border-radius:11px;padding:11px 18px;cursor:pointer;border:1px solid transparent;transition:transform .18s,filter .18s,border-color .15s}
.btn-gold{background:var(--gold-grad);color:#0B0D10;box-shadow:0 14px 32px -12px rgba(212,164,55,.5)}
.btn-gold:hover{transform:translateY(-2px);filter:brightness(1.03)}
.btn-ghost{background:var(--overlay-soft);color:var(--text);border-color:var(--overlay-bd)}
.btn-ghost:hover{border-color:var(--gold)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
/* topbar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.wordmark{font-family:'Sora';font-weight:700;font-style:italic;font-size:17px;color:var(--head);white-space:nowrap}
.wordmark b{color:var(--gold-deep)}
.mono-sq{width:32px;height:32px;border-radius:9px;background:var(--gold-grad);color:#0B0D10;display:inline-flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:13px;flex:none}
.top .sp{flex:1}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 8px}
.tab{border:1px solid var(--border);background:var(--overlay-soft);color:var(--muted);font-family:'Inter';font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer}
.tab:hover{color:var(--text);border-color:var(--gold-soft-bd)}
.tab.on{background:var(--gold-grad);color:#0B0D10;border-color:transparent}
/* hero */
.chead{padding:30px 0 8px}
.chead h1{font-size:32px;letter-spacing:-.5px;margin:8px 0 6px}
.intro{max-width:760px}
.intro p{color:var(--text);font-size:15px;margin-top:12px;line-height:1.7}
.metarow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.meta{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 15px;min-width:120px}
.meta .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-family:'IBM Plex Mono'}
.meta .v{font-family:'Sora';font-weight:700;font-size:18px;color:var(--head);margin-top:2px}
/* temas */
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:16px}
.tema{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:10px 13px;font-size:13.5px}
.tema .n{width:24px;height:24px;border-radius:7px;background:var(--gold-soft-bg);border:1px solid var(--gold-soft-bd);color:var(--gold-deep);font-family:'IBM Plex Mono';font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
/* sims */
.sec-title{font-family:'Sora';font-weight:700;font-size:19px;color:var(--head);margin:34px 0 4px;display:flex;align-items:center;gap:10px}
.sec-sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.sims{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sim{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:18px;display:flex;flex-direction:column}
.sim.full{border-color:var(--gold-soft-bd);background:linear-gradient(180deg,var(--gold-soft-bg),var(--panel))}
.sim h3{font-size:15.5px;letter-spacing:-.2px}
.sim .time{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono';font-size:12px;color:var(--gold-deep);margin-top:7px}
.sim .sd{color:var(--muted);font-size:13px;margin-top:10px;flex:1;line-height:1.6}
.sim .cta{margin-top:14px}
.foot{border-top:1px solid var(--border-soft);margin-top:44px;padding:26px 0 50px;color:var(--faint);font-size:13px}
@media(max-width:560px){.chead h1{font-size:25px}}
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ed-theme')||'dark');}catch(_){}</script>

var ORDER=['cfg','cnpi-cb','cnpi-cg1','cnpi-ct1'];
var CLOCK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function render(cert){
  var c=CERTS[cert]||CERTS.cfg;
  document.getElementById('tabs').innerHTML=ORDER.map(function(id){return '<button class="tab'+(id===cert?' on':'')+'" onclick="go(\''+id+'\')">'+esc(CERTS[id].code)+'</button>';}).join('');
  var temas=c.temas?('<h2 class="sec-title" style="font-size:16px;margin-top:26px">Temas cobrados no exame</h2><div class="temas">'+c.temas.map(function(t,i){return '<div class="tema"><span class="n">'+(i+1)+'</span><span>'+esc(t)+'</span></div>';}).join('')+'</div>'):'';
  var sims=c.sims.map(function(s){
    return '<div class="sim'+(s.full?' full':'')+'"><h3>'+esc(s.n)+'</h3>'+
      '<span class="time">'+CLOCK+' Tempo limite: '+s.t+' min</span>'+
      '<div class="sd">'+esc(s.d)+'</div>'+
      '<div class="cta"><a class="btn '+(s.full?'btn-gold':'btn-ghost')+' btn-sm" href="simulado.html">Fazer simulado grátis →</a></div></div>';
  }).join('');
  document.getElementById('content').innerHTML=
    '<div class="chead"><div class="eyebrow">'+esc(c.code)+'</div><h1>'+esc(c.name)+'</h1><div style="color:var(--muted);font-size:14px">'+esc(c.sub)+'</div>'+
      '<div class="intro">'+c.intro.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>'+
      '<div class="metarow">'+c.meta.map(function(mm){return '<div class="meta"><div class="k">'+esc(mm[0])+'</div><div class="v">'+esc(mm[1])+'</div></div>';}).join('')+'</div>'+
      temas+
    '</div>'+
    '<h2 class="sec-title">Simulados gratuitos <span style="font-family:Inter;font-weight:500;font-size:13px;color:var(--muted)">'+c.sims.length+' disponíveis</span></h2>'+
    '<div class="sec-sub">Cada simulado tem correção na hora, gabarito comentado e áudio de explicação. Comece de graça.</div>'+
    '<div class="sims">'+sims+'</div>';
  document.title=c.code+' · Cursos · Economia do Dia';
  try{history.replaceState(null,'','curso.html?cert='+cert);}catch(_){}
  window.scrollTo(0,0);
}
function go(cert){render(cert);}
(function(){
  var q=(location.search.match(/[?&]cert=([\w-]+)/)||[])[1];
  render(CERTS[q]?q:'cfg');
})();
