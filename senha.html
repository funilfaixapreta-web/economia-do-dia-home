<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Senha · Economia do Dia</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#08090C; --panel:#101319; --border:rgba(255,255,255,.08);
  --head:#FFFFFF; --text:#E7EAEF; --muted:#8A94A2; --faint:#5B6573;
  --input-bg:#0E1116; --overlay-soft:rgba(255,255,255,.05);
  --gold:#D4A437; --gold-deep:#E6BE54; --gold-grad:linear-gradient(180deg,#E6BE54,#D4A437);
  --mono-grad:linear-gradient(140deg,#EBC768,#D4A437 55%,#A8761B);
  --green:#2BB673; --red:#E0533D;
}
[data-theme="light"]{
  --bg:#F1EFE9; --panel:#FFFFFF; --border:rgba(27,31,38,.10);
  --head:#0B0D10; --text:#222831; --muted:#5B6573; --faint:#9AA3AF;
  --input-bg:#F3F1EA; --overlay-soft:rgba(27,31,38,.04); --gold-deep:#A6781A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:radial-gradient(120% 90% at 50% 0%,rgba(212,164,55,.06),transparent 55%)}
a{color:inherit;text-decoration:none}
.card{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:34px 30px;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px}
.mono-sq{width:32px;height:32px;border-radius:9px;background:var(--mono-grad);display:flex;align-items:center;justify-content:center}
.mono-sq span{font-family:'Sora';font-weight:800;font-style:italic;font-size:13px;color:#0B0D10}
.wordmark{font-family:'Sora';font-weight:700;font-style:italic;font-size:17px;color:var(--head)}
h1{font-family:'Sora';font-size:21px;letter-spacing:-.3px;color:var(--head);margin-bottom:7px}
.sub{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.fld{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);font-family:'Inter';font-size:15px}
.fld:focus{outline:none;border-color:rgba(212,164,55,.34)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--gold-grad);
  color:#0B0D10;font-family:'Inter';font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin-top:6px}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text);margin-top:9px}
.msg{padding:12px 14px;border-radius:11px;font-size:13.5px;line-height:1.55;margin-bottom:16px}
.msg.err{background:rgba(224,83,61,.10);border:1px solid rgba(224,83,61,.32);color:#E0533D}
.msg.ok{background:rgba(43,182,115,.10);border:1px solid rgba(43,182,115,.32);color:var(--green)}
.msg.info{background:rgba(212,164,55,.10);border:1px solid rgba(212,164,55,.30);color:var(--gold-deep)}
.forca{height:5px;border-radius:99px;background:var(--overlay-soft);overflow:hidden;margin-top:8px}
.forca i{display:block;height:100%;width:0;background:var(--red);transition:width .2s,background .2s}
.dica{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.5}
.volta{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.volta:hover{color:var(--gold-deep)}
.ok-ic{width:52px;height:52px;border-radius:999px;background:rgba(43,182,115,.12);
  border:1px solid rgba(43,182,115,.34);color:var(--green);font-size:24px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
</style>
</head>
<body>
<div class="card" id="tela"></div>

<script src="ed-api.js"></script>
<script>
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ed-theme')||'dark');}catch(_){}

var MARCA='<div class="logo"><span class="mono-sq"><span>ED</span></span>'
        +'<span class="wordmark">Economia <b>Do Dia</b></span></div>';

/* O link do e-mail traz o token no fragmento. Se veio, a pessoa ja esta
   autenticada só para trocar a senha. */
var DO_LINK = (window.EDApi&&EDApi.sessaoDoLink) ? EDApi.sessaoDoLink() : null;
var LOGADA  = !!(window.EDApi&&EDApi.sessao&&EDApi.sessao());

function forca(s){
  var n=0;
  if(s.length>=6)n++; if(s.length>=10)n++;
  if(/[A-Z]/.test(s)&&/[a-z]/.test(s))n++;
  if(/[0-9]/.test(s))n++; if(/[^A-Za-z0-9]/.test(s))n++;
  return Math.min(n,4);
}
function pintaForca(){
  var v=($('#s1')||{}).value||'', n=forca(v);
  var barra=$('#barra'); if(!barra)return;
  var cores=['#E0533D','#E0533D','#E8A33D','#2BB673','#2BB673'];
  barra.style.width=(n*25)+'%'; barra.style.background=cores[n];
}

/* ---------------------------------------------------------------- telas */
function telaPedir(msg){
  $('#tela').innerHTML = MARCA
    +'<h1>Esqueceu a senha?</h1>'
    +'<p class="sub">Informe o e-mail da sua conta. Se ela existir, enviamos um link para você criar uma senha nova.</p>'
    +(msg||'')
    +'<div class="field"><label for="em">E-mail</label>'
    +'<input class="fld" id="em" type="email" autocomplete="email" placeholder="voce@email.com"></div>'
    +'<button class="btn" id="ir">Enviar o link</button>'
    +'<a class="volta" href="login.html">← Voltar para o login</a>';
  $('#ir').onclick=pedir;
  $('#em').addEventListener('keydown',function(e){if(e.key==='Enter')pedir();});
  var u=null; try{u=JSON.parse(localStorage.getItem('ed-user')||'null')}catch(_){}
  if(u&&u.email)$('#em').value=u.email;
}

function telaNova(titulo,sub,msg){
  $('#tela').innerHTML = MARCA
    +'<h1>'+titulo+'</h1>'
    +'<p class="sub">'+sub+'</p>'
    +(msg||'')
    +'<div class="field"><label for="s1">Senha nova</label>'
    +'<input class="fld" id="s1" type="password" autocomplete="new-password">'
    +'<div class="forca"><i id="barra"></i></div>'
    +'<div class="dica">Pelo menos 6 caracteres. Misturar letras, números e símbolos deixa a conta bem mais segura.</div></div>'
    +'<div class="field"><label for="s2">Repita a senha nova</label>'
    +'<input class="fld" id="s2" type="password" autocomplete="new-password"></div>'
    +'<button class="btn" id="ir">Salvar a senha</button>'
    +'<a class="volta" href="app.html">← Voltar</a>';
  $('#ir').onclick=salvar;
  $('#s1').addEventListener('input',pintaForca);
  $('#s2').addEventListener('keydown',function(e){if(e.key==='Enter')salvar();});
}

function telaPronto(txt,destino){
  $('#tela').innerHTML = MARCA
    +'<div class="ok-ic">✓</div>'
    +'<h1 style="text-align:center">Tudo certo</h1>'
    +'<p class="sub" style="text-align:center">'+txt+'</p>'
    +'<a class="btn" href="'+destino+'">Continuar</a>';
}

/* ---------------------------------------------------------------- ações */
function pedir(){
  var em=($('#em').value||'').trim();
  if(!em||em.indexOf('@')<0){telaPedir('<div class="msg err">Informe um e-mail válido.</div>');return;}
  var b=$('#ir'); b.disabled=true; b.textContent='Enviando…';
  EDApi.recuperar(em).then(function(){
    $('#tela').innerHTML = MARCA
      +'<div class="ok-ic">✓</div>'
      +'<h1 style="text-align:center">Verifique seu e-mail</h1>'
      +'<p class="sub" style="text-align:center">Se existir uma conta com <b>'+esc(em)+'</b>, '
      +'o link para criar a senha nova chega em instantes. Ele vale por 1 hora.</p>'
      +'<p class="sub" style="text-align:center;font-size:13px">Não chegou? Veja o spam, ou tente de novo em alguns minutos.</p>'
      +'<a class="btn btn-ghost" href="login.html">Voltar para o login</a>';
  }).catch(function(e){
    b.disabled=false; b.textContent='Enviar o link';
    /* nao dizemos se o e-mail existe ou nao: isso entregaria a lista de alunos */
    telaPedir('<div class="msg err">Não consegui enviar agora: '+esc(e&&e.message||'erro')+'</div>');
  });
}

function salvar(){
  var a=$('#s1').value||'', b2=$('#s2').value||'';
  if(a.length<6)   return telaErroNova('A senha precisa ter pelo menos 6 caracteres.');
  if(a!==b2)       return telaErroNova('As duas senhas não são iguais.');
  var b=$('#ir'); b.disabled=true; b.textContent='Salvando…';
  EDApi.trocarSenha(a).then(function(){
    telaPronto('Sua senha foi trocada. Já pode entrar com ela.','app.html');
  }).catch(function(e){
    var m=(e&&e.message)||'erro';
    if(/expired|invalid|JWT/i.test(m))
      m='Este link já expirou. Peça um novo em "Esqueci minha senha".';
    telaErroNova(m);
  });
}
function telaErroNova(msg){
  var t=DO_LINK?'Criar senha nova':'Trocar a senha';
  var s=DO_LINK?'Escolha a senha que você vai usar daqui em diante.'
               :'Escolha a senha que você vai usar daqui em diante.';
  telaNova(t,s,'<div class="msg err">'+esc(msg)+'</div>');
}

/* ---------------------------------------------------------------- rota */
(function(){
  if(DO_LINK&&DO_LINK.erro){
    telaPedir('<div class="msg err">'+esc(DO_LINK.erro)+' Peça um link novo abaixo.</div>');
    return;
  }
  if(DO_LINK&&DO_LINK.ok){
    telaNova('Criar senha nova','Escolha a senha que você vai usar daqui em diante.');
    return;
  }
  if(LOGADA){
    telaNova('Trocar a senha','Escolha a senha que você vai usar daqui em diante.');
    return;
  }
  telaPedir();
})();
</script>
</body>
</html>
