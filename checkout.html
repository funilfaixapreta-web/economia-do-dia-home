<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finalizar compra · Economia do Dia</title>
<meta name="description" content="Finalize a compra dos cursos do Economia do Dia." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#08090C; --panel:#101319; --panel-2:#0D0F14;
  --border:rgba(255,255,255,.08); --border-soft:rgba(255,255,255,.06);
  --head:#FFFFFF; --text:#E7EAEF; --muted:#8A94A2; --faint:#5B6573;
  --input-bg:#0E1116; --overlay-soft:rgba(255,255,255,.05);
  --gold:#D4A437; --gold-bright:#E6BE54; --gold-deep:#E6BE54;
  --gold-soft-bg:rgba(212,164,55,.10); --gold-soft-bd:rgba(212,164,55,.34);
  --gold-grad:linear-gradient(180deg,#E6BE54,#D4A437);
  --mono-grad:linear-gradient(140deg,#EBC768,#D4A437 55%,#A8761B);
  --green:#2BB673; --red:#E0533D;
}
[data-theme="light"]{
  --bg:#F1EFE9; --panel:#FFFFFF; --panel-2:#F3F1EA;
  --border:rgba(27,31,38,.10); --border-soft:rgba(27,31,38,.07);
  --head:#0B0D10; --text:#222831; --muted:#5B6573; --faint:#9AA3AF;
  --input-bg:#F3F1EA; --overlay-soft:rgba(27,31,38,.04); --gold-deep:#A6781A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
  transition:background .4s,color .4s;
  background-image:radial-gradient(120% 70% at 50% 0%,rgba(212,164,55,.05),transparent 55%)}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;padding:18px 26px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.mono-sq{width:30px;height:30px;border-radius:9px;background:var(--mono-grad);display:flex;align-items:center;justify-content:center}
.mono-sq span{font-family:'Sora';font-weight:800;font-style:italic;font-size:12px;color:#0B0D10}
.wordmark{font-family:'Sora';font-weight:700;font-style:italic;font-size:16px;color:var(--head)}
.top .voltar{margin-left:auto;font-size:13.5px;color:var(--muted)}
.top .voltar:hover{color:var(--gold-deep)}
.wrap{max-width:980px;margin:0 auto;padding:34px 24px 70px}
h1{font-family:'Sora';font-size:27px;letter-spacing:-.5px;color:var(--head);margin-bottom:6px}
.lead{color:var(--muted);font-size:14.5px;margin-bottom:26px}
.grade{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px}
.card+.card{margin-top:16px}
h2{font-size:15px;color:var(--head);margin-bottom:16px;display:flex;align-items:center;gap:9px}
h2 i{width:22px;height:22px;border-radius:7px;background:var(--gold-soft-bg);border:1px solid var(--gold-soft-bd);
  color:var(--gold-deep);font:600 11px/21px 'IBM Plex Mono',monospace;text-align:center;font-style:normal}
.grp{margin-bottom:14px}
.grp label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.fld{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);font-family:'Inter';font-size:14.5px}
.fld:focus{outline:none;border-color:var(--gold-soft-bd)}
.fld.erro{border-color:rgba(224,83,61,.7)}
.msg{font-size:12px;color:#E0533D;min-height:0;margin-top:5px}
.msg:empty{display:none}
.obr{color:var(--gold-deep);font-weight:700}
.obr-nota{font-size:12px;color:var(--muted);margin-top:4px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pgs{display:flex;flex-direction:column;gap:9px}
.pg{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;cursor:pointer}
.pg:hover{border-color:var(--gold-soft-bd)}
.pg.on{border-color:var(--gold-soft-bd);background:var(--gold-soft-bg)}
.pg .ic{width:34px;height:34px;border-radius:9px;background:var(--overlay-soft);display:flex;align-items:center;justify-content:center;font-size:15px}
.pg .tt{font-size:14px;font-weight:600;color:var(--head)}
.pg .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.pg input{margin-left:auto;accent-color:var(--gold)}
.res{position:sticky;top:22px}
.ri{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid var(--border-soft)}
.ri .nm{font-size:13.5px;font-weight:600;color:var(--head);line-height:1.35}
.ri .qt{font-size:12px;color:var(--muted);margin-top:2px}
.ri .pr{margin-left:auto;font-family:'IBM Plex Mono';font-size:13.5px;color:var(--head);white-space:nowrap}
.tot{display:flex;align-items:baseline;padding-top:15px}
.tot span{color:var(--muted);font-size:14px}
.tot b{margin-left:auto;font-family:'IBM Plex Mono';font-size:24px;color:var(--head);font-weight:600}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--gold-grad);
  color:#0B0D10;font-family:'Inter';font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin-top:16px}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text)}
.nota{font-size:12px;color:var(--faint);text-align:center;margin-top:11px;line-height:1.55}
.aviso{padding:13px 15px;border-radius:11px;font-size:13.5px;line-height:1.5;margin-bottom:18px}
.aviso.alerta{background:rgba(224,83,61,.10);border:1px solid rgba(224,83,61,.32);color:#E0533D}
.aviso.info{background:var(--gold-soft-bg);border:1px solid var(--gold-soft-bd);color:var(--gold-deep)}
.vazio{text-align:center;padding:70px 20px}
.vazio h1{margin-bottom:10px}
.ok-ic{width:56px;height:56px;border-radius:999px;background:rgba(43,182,115,.12);border:1px solid rgba(43,182,115,.34);
  color:var(--green);font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.pedido-n{font-family:'IBM Plex Mono';font-size:15px;color:var(--gold-deep);
  background:var(--gold-soft-bg);border:1px solid var(--gold-soft-bd);border-radius:9px;padding:7px 14px;display:inline-block;margin:12px 0 4px}
.passos{text-align:left;max-width:430px;margin:22px auto 0;font-size:14px;color:var(--muted);line-height:1.75}
.pag{max-width:460px;margin:0 auto;text-align:center}
.qr{width:220px;height:220px;border-radius:14px;background:#fff;padding:10px;margin:18px auto 6px;display:block}
.copia{display:flex;gap:8px;margin-top:14px}
.copia .fld{font-family:'IBM Plex Mono',monospace;font-size:12px}
.copia button{flex:none;padding:0 16px;border-radius:10px;border:1px solid var(--gold-soft-bd);background:var(--gold-soft-bg);
  color:var(--gold-deep);font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer}
.espera{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:20px;font-size:13.5px;color:var(--muted)}
.espera i{width:9px;height:9px;border-radius:99px;background:var(--gold);animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{opacity:.25}}
.trocar{margin-top:22px;font-size:13px;color:var(--faint)}
.trocar a{color:var(--muted);text-decoration:underline;cursor:pointer;margin:0 5px}
.parc{margin-top:12px;display:none}
.parc.on{display:block}
.theme-seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--overlay-soft);border:1px solid var(--border)}
.theme-seg button{font-family:'Inter';font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px;border:none;background:none;color:var(--muted);cursor:pointer}
.theme-seg button.on{background:var(--gold-grad);color:#0B0D10}
@media(max-width:880px){.grade{grid-template-columns:1fr}.res{position:static}}
</style>
</head>
<body>

<div class="top">
  <a class="logo" href="index.html"><span class="mono-sq"><span>ED</span></span><span class="wordmark">Economia <b>Do Dia</b></span></a>
  <div class="theme-seg" id="theme-seg">
    <button data-theme="dark">Escuro</button><button data-theme="light">Claro</button>
  </div>
  <a class="voltar" href="index.html#cursos">← Continuar comprando</a>
</div>

<div class="wrap" id="tela"></div>

<script src="ed-api.js"></script>
<script src="ed-conteudo.js"></script>
<script src="carrinho.js"></script>
<script>
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* tema, igual ao resto do site */
(function(){var t='dark';try{t=localStorage.getItem('ed-theme')||'dark'}catch(_){}
  aplicaTema(t);})();
function aplicaTema(t){document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('#theme-seg button').forEach(function(b){
    b.classList.toggle('on',b.dataset.theme===t)});
  try{localStorage.setItem('ed-theme',t)}catch(_){}}
document.querySelectorAll('#theme-seg button').forEach(function(b){
  b.onclick=function(){aplicaTema(b.dataset.theme)}});

function usuario(){try{return JSON.parse(localStorage.getItem('ed-user')||'null')}catch(_){return null}}
function noBanco(){return !!(window.EDApi&&EDApi.sessao())}

var METODO='pix', PARCELAS=1;

/* CPF com os digitos verificadores: o ASAAS recusa CPF invalido, e e melhor
   o aluno saber aqui do que ver a cobranca falhar depois. */
function cpfValido(v){
  var d=String(v||'').replace(/\D/g,'');
  if(d.length===14)return true;            /* CNPJ: o ASAAS confere */
  if(d.length!==11||/^(\d)\1+$/.test(d))return false;
  for(var t=9;t<11;t++){
    var s=0;for(var i=0;i<t;i++)s+=+d[i]*(t+1-i);
    if(((s*10)%11)%10!==+d[t])return false;
  }
  return true;
}

function opcoesParcelas(total){
  var h='';
  for(var n=1;n<=12;n++){
    if(n>1&&total/n<500)break;              /* parcela minima do ASAAS: R$ 5 */
    h+='<option value="'+n+'"'+(n===PARCELAS?' selected':'')+'>'
      +(n===1?'À vista · ':n+'x de ')+EDCarrinho.emReais(Math.round(total/n))+'</option>';
  }
  return h;
}

/* ------------------------------------------------------------------ telas */
function telaVazia(){
  return '<div class="vazio"><h1>Seu carrinho está vazio</h1>'
    +'<p class="lead">Escolha um curso para começar.</p>'
    +'<a class="btn" style="max-width:280px;margin:0 auto" href="index.html#cursos">Ver os cursos</a></div>';
}

function telaCheckout(){
  var itens=EDCarrinho.itens(), u=usuario()||{};
  var resumo=itens.map(function(i){
    return '<div class="ri"><div><div class="nm">'+esc(i.nome)+'</div>'
      +'<div class="qt">'+(i.validade?esc(i.validade)+' · ':'')+'quantidade '+i.quantidade+'</div></div>'
      +'<div class="pr">'+EDCarrinho.emReais(i.centavos*i.quantidade)+'</div></div>';
  }).join('');

  var precisaEntrar = !u.email;

  return '<h1>Finalizar compra</h1>'
    +'<p class="lead">Revise o pedido e escolha como quer pagar.</p>'
    +'<div class="grade"><div>'
      + (precisaEntrar
          ? '<div class="aviso info">Para concluir a compra você precisa de uma conta: é ela que guarda seu acesso aos cursos. '
            +'<a href="login.html?next=checkout.html" style="text-decoration:underline">Entrar ou criar conta →</a></div>'
          : '')
      +'<div class="card"><h2><i>1</i>Seus dados</h2>'
        +'<div class="grp"><label for="f-nome">Nome completo <b class="obr">*</b></label>'
          +'<input class="fld" id="f-nome" value="'+esc(u.nome||'')+'" placeholder="Como está no seu documento" maxlength="120" autocomplete="name" required>'
          +'<div class="msg" data-msg="f-nome"></div></div>'
        +'<div class="dupla">'
          +'<div class="grp"><label for="f-email">E-mail <b class="obr">*</b></label><input class="fld" id="f-email" type="email" value="'+esc(u.email||'')+'" placeholder="voce@email.com" maxlength="160" autocomplete="email" required><div class="msg" data-msg="f-email"></div></div>'
          +'<div class="grp"><label for="f-tel">Telefone (WhatsApp) <b class="obr">*</b></label><input class="fld" id="f-tel" type="tel" inputmode="numeric" value="'+esc(mascaraTel(u.telefone||''))+'" placeholder="(21) 90000-0000" maxlength="15" autocomplete="tel-national" required><div class="msg" data-msg="f-tel"></div></div>'
        +'</div>'
        +'<div class="grp"><label for="f-cpf">CPF <b class="obr">*</b></label><input class="fld" id="f-cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off" required><div class="msg" data-msg="f-cpf"></div></div>'
        +'<p class="obr-nota"><b class="obr">*</b> Campos obrigatórios. O CPF e o telefone vão na cobrança e no aviso de pagamento.</p>'
      +'</div>'
      +'<div class="card"><h2><i>2</i>Forma de pagamento</h2><div class="pgs" id="pgs">'
        +metodoLinha('pix','PIX','Aprovação na hora','⚡')
        +metodoLinha('cartao','Cartão de crédito','Parcele em até 12x','▭')
        +metodoLinha('boleto','Boleto','Compensa em até 3 dias úteis','▤')
      +'</div>'
      +'<div class="parc grp'+(METODO==='cartao'?' on':'')+'" id="parc"><label>Parcelas</label>'
        +'<select class="fld" id="f-parc">'+opcoesParcelas(EDCarrinho.total())+'</select></div>'
      +'</div>'
    +'</div>'
    +'<div class="card res"><h2><i>3</i>Resumo</h2>'+resumo
      +'<div class="tot"><span>Total</span><b>'+EDCarrinho.emReais(EDCarrinho.total())+'</b></div>'
      +'<button class="btn" id="btn-fechar">Concluir pedido</button>'
      +'<div class="nota">Seu acesso é liberado assim que o pagamento for confirmado.</div>'
    +'</div></div>';
}

function metodoLinha(id,tt,ds,ic){
  return '<label class="pg'+(METODO===id?' on':'')+'" data-pg="'+id+'">'
    +'<span class="ic">'+ic+'</span><span><span class="tt">'+tt+'</span>'
    +'<span class="ds" style="display:block">'+ds+'</span></span>'
    +'<input type="radio" name="pg" value="'+id+'"'+(METODO===id?' checked':'')+'></label>';
}

function telaPronto(p){
  var comoPagar={
    pix:'Você vai receber o código PIX no e-mail cadastrado. Assim que o pagamento cair, o acesso é liberado automaticamente.',
    cartao:'Você vai receber o link seguro de pagamento no e-mail cadastrado.',
    boleto:'O boleto chega no seu e-mail. A compensação leva até 3 dias úteis.'
  }[p.metodo]||'';
  return '<div class="vazio"><div class="ok-ic">✓</div>'
    +'<h1>Pedido registrado</h1>'
    +'<div class="pedido-n">Pedido nº '+esc(p.numero)+'</div>'
    +'<p class="lead">'+(p.total!=null?EDCarrinho.emReais(p.total)+' · ':'')+'aguardando pagamento</p>'
    +'<div class="passos">'+esc(comoPagar)+'</div>'
    +'<div style="max-width:280px;margin:26px auto 0">'
      +'<a class="btn" href="app.html">Ir para a área do aluno</a>'
      +'<a class="btn btn-ghost" style="margin-top:9px" href="index.html#cursos">Continuar comprando</a>'
    +'</div></div>';
}

/* ------------------------------------------------------------------ fluxo */
function desenhar(){
  var alvo=$('#tela');
  if(!EDCarrinho.contagem()){alvo.innerHTML=telaVazia();return;}
  alvo.innerHTML=telaCheckout();

  document.querySelectorAll('[data-pg]').forEach(function(el){
    el.onclick=function(){
      METODO=el.getAttribute('data-pg');
      document.querySelectorAll('[data-pg]').forEach(function(x){
        x.classList.toggle('on',x===el)});
      $('#parc').classList.toggle('on',METODO==='cartao');
    };
  });
  $('#f-parc').onchange=function(){PARCELAS=parseInt(this.value,10)||1;};
  /* mascara enquanto digita: o campo nunca passa do tamanho de um CPF ou
     telefone, mesmo colando texto com sobra */
  $('#f-cpf').addEventListener('input',function(){this.value=mascaraCpf(this.value);limparErro(this);});
  $('#f-tel').addEventListener('input',function(){this.value=mascaraTel(this.value);limparErro(this);});
  ['#f-nome','#f-email'].forEach(function(id){$(id).addEventListener('input',function(){limparErro(this);});});
  $('#btn-fechar').onclick=concluir;
}

function mascaraCpf(v){
  var d=String(v||'').replace(/\D/g,'').slice(0,11);
  return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/,'.$1-$2');
}
function mascaraTel(v){
  var d=String(v||'').replace(/\D/g,'');
  if(d.length>11&&d.indexOf('55')===0)d=d.slice(2);   /* +55 colado junto */
  d=d.slice(0,11);
  if(d.length<=2)return d.length?'('+d:'';
  if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);
  if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
}
function erroCampo(id,msg){
  var f=$('#'+id),m=document.querySelector('[data-msg="'+id+'"]');
  if(f)f.classList.add('erro');
  if(m)m.textContent=msg;
  return msg;
}
function limparErro(f){
  f.classList.remove('erro');
  var m=document.querySelector('[data-msg="'+f.id+'"]');if(m)m.textContent='';
}
/* os mesmos limites do criar_pedido() no banco */
function conferirDados(d){
  var erros=[];
  var nome=d.nome.trim().replace(/\s+/g,' ');
  if(nome.length<3||nome.length>120||nome.split(' ').length<2)erros.push(erroCampo('f-nome','Escreva seu nome e sobrenome.'));
  var email=d.email.trim();
  if(email.length>160||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))erros.push(erroCampo('f-email','Confira o e-mail.'));
  var tel=d.telefone.replace(/\D/g,'');
  if(tel.length<10||tel.length>11)erros.push(erroCampo('f-tel','Informe DDD e número.'));
  if(!cpfValido(d.documento))erros.push(erroCampo('f-cpf','CPF inválido. Confira os números.'));
  return erros;
}

function concluir(){
  var u=usuario();
  var dados={
    nome:($('#f-nome')||{}).value||'', email:($('#f-email')||{}).value||'',
    telefone:($('#f-tel')||{}).value||'', documento:($('#f-cpf')||{}).value||''
  };
  if(conferirDados(dados).length){
    var primeiro=document.querySelector('.fld.erro');
    if(primeiro){primeiro.focus();primeiro.scrollIntoView({block:'center',behavior:'smooth'});}
    return;
  }
  dados.nome=dados.nome.trim().replace(/\s+/g,' ');
  dados.email=dados.email.trim();
  if(!u||!u.email){
    /* sem conta nao existe para onde mandar o acesso: manda criar e volta */
    try{localStorage.setItem('ed-checkout-dados',JSON.stringify(dados))}catch(_){}
    location.href='login.html?next=checkout.html';
    return;
  }

  var b=$('#btn-fechar'); b.disabled=true; b.textContent='Registrando…';
  var itens=EDCarrinho.itens().map(function(i){
    return {plano_id:i.id, quantidade:i.quantidade};
  });
  var totalLocal=EDCarrinho.total();

  registrarPedido(itens,dados).then(function(r){
    if(!r||!r.ok){
      b.disabled=false; b.textContent='Concluir pedido';
      /* o banco confere os mesmos campos; se recusar, aponta o campo */
      var campo={nome:['f-nome','Escreva seu nome e sobrenome.'],email:['f-email','Confira o e-mail.'],
                 telefone:['f-tel','Informe DDD e número.'],cpf:['f-cpf','CPF inválido. Confira os números.']}[r&&r.motivo];
      if(campo){erroCampo(campo[0],campo[1]);var f=$('#'+campo[0]);if(f)f.focus();return;}
      alert('Não foi possível registrar o pedido: '+((r&&r.motivo)||'erro desconhecido'));
      return;
    }
    EDCarrinho.limpar();
    PEDIDO={id:r.pedido, numero:r.numero,
            total:(r.total_centavos!=null?r.total_centavos:totalLocal), metodo:METODO};
    if(r.local||!r.pedido){
      $('#tela').innerHTML=telaPronto(PEDIDO);
      window.scrollTo(0,0);
      return;
    }
    try{history.replaceState(null,'','checkout.html?pedido='+r.pedido+'&n='+r.numero)}catch(_){}
    gerarCobranca(METODO,PARCELAS);
  }).catch(function(e){
    b.disabled=false; b.textContent='Concluir pedido';
    alert('Não foi possível registrar o pedido: '+(e&&e.message||'erro'));
  });
}

/* ------------------------------------------------------------ cobranca
   O pedido ja existe no banco. Aqui ele vira cobranca no ASAAS. Se o ASAAS
   ainda nao estiver ligado (sem chave), cai na tela antiga: pedido
   registrado, o admin confirma na mao. Nenhuma venda se perde. */
var PEDIDO=null, ESPERA=null;

function gerarCobranca(metodo,parcelas){
  if(metodo)METODO=metodo; PARCELAS=parcelas||1;
  $('#tela').innerHTML='<div class="vazio"><div class="espera"><i></i>Gerando a cobrança…</div></div>';
  window.scrollTo(0,0);
  EDApi.funcao('asaas-cobranca',{pedido:PEDIDO.id, metodo:metodo||undefined, parcelas:PARCELAS}).then(function(c){
    if(c&&c.ok&&c.status==='pago'){telaPago();return;}
    if(c&&c.ok){
      if(c.total_centavos!=null)PEDIDO.total=c.total_centavos;
      if(c.numero!=null)PEDIDO.numero=c.numero;
      $('#tela').innerHTML=telaPagamento(c);
      ligarPagamento(c);
      esperarPagamento();
      return;
    }
    if(c&&c.motivo==='gateway-desligado'){$('#tela').innerHTML=telaPronto(PEDIDO);return;}
    falhaCobranca(c&&c.motivo==='cpf'
      ? 'O CPF do pedido não foi aceito. Fale com a gente para corrigir.'
      : 'Não conseguimos gerar a cobrança agora. Seu pedido está guardado.');
  }).catch(function(){
    falhaCobranca('Não conseguimos gerar a cobrança agora. Seu pedido está guardado.');
  });
}

function falhaCobranca(msg){
  $('#tela').innerHTML='<div class="vazio pag">'
    +'<div class="aviso alerta">'+esc(msg)+'</div>'
    +(PEDIDO.numero?'<div class="pedido-n">Pedido nº '+esc(PEDIDO.numero)+'</div>':'')
    +'<button class="btn" id="btn-de-novo">Tentar de novo</button>'
    +'<a class="btn btn-ghost" style="margin-top:9px" href="app.html">Ir para a área do aluno</a></div>';
  $('#btn-de-novo').onclick=function(){gerarCobranca(METODO,PARCELAS)};
}

function telaPagamento(c){
  var h='<div class="vazio pag">'
    +'<div class="pedido-n">Pedido nº '+esc(PEDIDO.numero)+'</div>'
    +'<p class="lead" style="margin-bottom:6px">'+EDCarrinho.emReais(PEDIDO.total)
      +(c.parcelas>1?' em '+c.parcelas+'x':'')+'</p>';

  if(c.metodo==='pix'){
    h+='<h1>Pague com Pix</h1>'
      +(c.pix_qr?'<img class="qr" alt="QR code do Pix" src="data:image/png;base64,'+esc(c.pix_qr)+'">':'')
      +(c.pix_copia_cola
        ?'<div class="copia"><input class="fld" id="cc" readonly value="'+esc(c.pix_copia_cola)+'">'
          +'<button data-copiar="cc">Copiar</button></div>'
        :'')
      +(!c.pix_qr&&!c.pix_copia_cola&&c.cobranca_url
        ?'<a class="btn" target="_blank" rel="noopener" href="'+esc(c.cobranca_url)+'">Abrir o Pix</a>':'')
      +'<div class="passos" style="text-align:center">Abra o app do seu banco, escolha Pix e leia o QR code ou cole o código. O acesso é liberado assim que o pagamento cair.</div>';
  }else if(c.metodo==='cartao'){
    h+='<h1>Pague com cartão</h1>'
      +'<div class="passos" style="text-align:center">O pagamento é feito na página segura do ASAAS. Os dados do cartão não passam pelo nosso site.</div>'
      +'<a class="btn" target="_blank" rel="noopener" href="'+esc(c.cobranca_url)+'">Pagar com cartão</a>';
  }else{
    h+='<h1>Seu boleto</h1>'
      +(c.boleto_linha
        ?'<div class="copia"><input class="fld" id="cc" readonly value="'+esc(c.boleto_linha)+'">'
          +'<button data-copiar="cc">Copiar</button></div>':'')
      +'<a class="btn" target="_blank" rel="noopener" href="'+esc(c.boleto_url||c.cobranca_url)+'">Abrir o boleto</a>'
      +'<div class="passos" style="text-align:center">Vence em '+esc(dataBR(c.vence_em))+'. A compensação leva até 3 dias úteis e o acesso é liberado sozinho quando cair.</div>';
  }

  h+='<div class="espera" id="espera"><i></i>Aguardando a confirmação do pagamento</div>'
    +'<div class="trocar">Pagar de outro jeito:'
      +(c.metodo!=='pix'?'<a data-trocar="pix">Pix</a>':'')
      +(c.metodo!=='cartao'?'<a data-trocar="cartao">Cartão</a>':'')
      +(c.metodo!=='boleto'?'<a data-trocar="boleto">Boleto</a>':'')
    +'</div></div>';
  return h;
}

function dataBR(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:'';}

function ligarPagamento(){
  document.querySelectorAll('[data-copiar]').forEach(function(b){
    b.onclick=function(){
      var el=document.getElementById(b.getAttribute('data-copiar'));
      var feito=function(){b.textContent='Copiado';setTimeout(function(){b.textContent='Copiar'},1800)};
      if(navigator.clipboard)navigator.clipboard.writeText(el.value).then(feito,function(){el.select();document.execCommand('copy');feito()});
      else{el.select();document.execCommand('copy');feito();}
    };
  });
  document.querySelectorAll('[data-trocar]').forEach(function(a){
    a.onclick=function(){
      var m=a.getAttribute('data-trocar');
      if(m==='cartao'){
        var n=prompt('Em quantas parcelas? (1 a 12)','1');
        if(n===null)return;
        gerarCobranca('cartao',Math.min(12,Math.max(1,parseInt(n,10)||1)));
      }else gerarCobranca(m,1);
    };
  });
}

/* pergunta ao banco a cada 5 s se ja caiu; o webhook do ASAAS e quem marca */
function esperarPagamento(){
  if(ESPERA)clearInterval(ESPERA);
  var voltas=0;
  ESPERA=setInterval(function(){
    if(++voltas>720){clearInterval(ESPERA);return;}     /* 1 hora */
    if(document.hidden)return;
    EDApi.rpc('status_do_pedido',{p_pedido:PEDIDO.id}).then(function(r){
      if(r&&r.status==='pago'){clearInterval(ESPERA);telaPago();}
    }).catch(function(){});
  },5000);
}

function telaPago(){
  if(ESPERA)clearInterval(ESPERA);
  $('#tela').innerHTML='<div class="vazio"><div class="ok-ic">✓</div>'
    +'<h1>Pagamento confirmado</h1>'
    +(PEDIDO&&PEDIDO.numero?'<div class="pedido-n">Pedido nº '+esc(PEDIDO.numero)+'</div>':'')
    +'<p class="lead">Seus cursos já estão liberados.</p>'
    +'<div style="max-width:280px;margin:22px auto 0"><a class="btn" href="app.html">Começar a estudar</a></div></div>';
  window.scrollTo(0,0);
}

/* No banco quando a ponte está ligada; senão guarda o pedido aqui para o
   admin ver — nenhuma venda se perde por causa da chave estar desligada. */
function registrarPedido(itens,dados){
  if(noBanco()&&window.EDApi&&EDApi.rpc)
    return EDApi.rpc('criar_pedido',{p_itens:itens,p_dados:dados});

  var lista=[];
  try{lista=JSON.parse(localStorage.getItem('ed-pedidos')||'[]')}catch(_){}
  var num=lista.length+1;
  lista.push({numero:num, criado_em:Date.now(), status:'aguardando', metodo:METODO,
              dados:dados, itens:EDCarrinho.itens(), total_centavos:EDCarrinho.total()});
  try{localStorage.setItem('ed-pedidos',JSON.stringify(lista))}catch(_){}
  return Promise.resolve({ok:true, numero:num, total_centavos:EDCarrinho.total(), local:true});
}

/* Voltou do login: recupera o que já tinha sido digitado. */
(function(){
  try{
    var d=JSON.parse(localStorage.getItem('ed-checkout-dados')||'null');
    if(d){window.__dadosSalvos=d;localStorage.removeItem('ed-checkout-dados');}
  }catch(_){}
})();

/* Recarregou a tela de pagamento (ou voltou pelo link): retoma a cobranca
   que ja existe em vez de mostrar o carrinho vazio. */
var RETOMA=(function(){try{return new URLSearchParams(location.search)}catch(_){return null}})();
if(RETOMA&&RETOMA.get('pedido')&&noBanco()){
  PEDIDO={id:RETOMA.get('pedido'), numero:RETOMA.get('n')||'', total:null};
  gerarCobranca(null,1);
}else desenhar();
if(window.__dadosSalvos){
  var d=window.__dadosSalvos;
  ['nome','email','tel','cpf'].forEach(function(k,i){
    var el=$('#f-'+k), v=[d.nome,d.email,d.telefone,d.documento][i];
    if(el&&v&&!el.value)el.value=k==='cpf'?mascaraCpf(v):k==='tel'?mascaraTel(v):v;
  });
}
</script>
